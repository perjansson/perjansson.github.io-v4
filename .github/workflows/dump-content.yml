name: Dump content (temporary)

on:
  push:
    branches: [claude/portfolio-v4-redesign-lqnu30]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch project copy from Contentful
        env:
          SPACE: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_SPACE_ID }}
          TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          query='{ projectCollection(limit: 30) { items { sys { id } title titleShort client city role tech tags description { json } me { json } } } }'
          printf '%s' "$query" | jq -Rs '{query: .}' > body.json

          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json \
            "https://graphql.contentful.com/content/v1/spaces/$SPACE" > resp.json

          echo "=== ERRORS (if any) ==="
          jq -r '.errors // empty' resp.json

          echo "=== BEGIN DUMP ==="
          jq -r '
            [
              "4KEcXshZlUKeccE6aZE3bc","3ClSBoWvHLCHibXiNxV6P0","4p5fCHxE7MGVDq3eLcl1ne",
              "6LVQ53UtLkZPL1g658AGVA","2TgimFk79Df42v7et1olvC","4QXLtiHpA2BRzx9QPwRovf",
              "1Gpt12DWWFsaNpCyTpsO52","32saUq4YU9o3hfd7UZG8CX"
            ] as $want
            | .data.projectCollection.items[]
            | select(.sys.id as $id | $want | index($id))
            | "@@@ID " + .sys.id,
              "TITLE " + (.title // ""),
              "SHORT " + (.titleShort // ""),
              "CLIENT " + (.client // ""),
              "CITY " + (.city // ""),
              "ROLE " + (.role // ""),
              "TECH " + ((.tech // []) | join(", ")),
              "TAGS " + ((.tags // []) | join(", ")),
              "DESC " + ([.description.json | .. | .value? // empty] | join(" ")),
              "MINE " + ([.me.json | .. | .value? // empty] | join(" ")),
              ""
          ' resp.json
          echo "=== END DUMP ==="
